name: Resolve Course Geometry Full Audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/resolve_course_geometry_full.yml"

permissions:
  contents: write

env:
  BASE_GZ_B64: ""
  FETCH_MANIFEST_GZ_B64: ""
  FETCH_PY_GZ_B64: ""
  MERGE_PY_GZ_B64: ""

jobs:
  fetch:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore embedded inputs
        run: |
          echo "$FETCH_MANIFEST_GZ_B64" | base64 -d | gzip -d > course_metadata_fetch_manifest.csv
          echo "$FETCH_PY_GZ_B64" | base64 -d | gzip -d > fetch_course_metadata.py
      - name: Install dependencies
        run: pip install pandas requests beautifulsoup4
      - name: Fetch race-level course metadata
        run: python fetch_course_metadata.py --shard-index ${{ matrix.shard }} --shard-count 4 --out course_meta_part_${{ matrix.shard }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: course-meta-${{ matrix.shard }}
          path: course_meta_part_${{ matrix.shard }}.csv
          retention-days: 3

  merge:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore embedded master and merger
        run: |
          echo "$BASE_GZ_B64" | base64 -d | gzip -d > course_geometry_base_manifest.csv
          echo "$MERGE_PY_GZ_B64" | base64 -d | gzip -d > merge_course_metadata.py
      - name: Install dependencies
        run: pip install pandas numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: course-meta-*
          path: parts
      - name: Merge and audit
        run: python merge_course_metadata.py
      - name: Commit resolved masters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add course_metadata_raw.csv date_course_master_resolved.csv race_route_ambiguous_resolved.csv course_geometry_master_resolved.csv course_geometry_audit_summary.csv
          git diff --cached --quiet || git commit -m "Resolve course geometry metadata"
          git push
